<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Online teszt</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<h1>Online teszt felület</h1>

<div id="login-box">
  <p>Kérlek jelentkezz be Google fiókoddal a folytatáshoz:</p>
  <div id="g_id_signin"></div>
</div>

<div id="app-box" style="display:none;">
  <p>Bejelentkezve: <strong id="user-email"></strong>
     (<a href="#" id="logout-link">kijelentkezés</a>)</p>

  <p id="auth-warning" class="bad" style="display:none; font-weight:600;">
    Nincs jogosultságod tesztek kitöltéséhez - kérlek vedd fel a kapcsolatot a tanároddal.
  </p>

  <div class="week-picker">
    <label for="test-select">Teszt kiválasztása:</label><br>
    <select id="test-select" disabled></select>
    <br>
    <button class="primary" id="start-btn" disabled>Teszt indítása (12 feladat)</button>
  </div>

  <p><a href="result.html">Eddigi eredmények megtekintése &rarr;</a></p>
  <p id="admin-link" style="display:none;"><a href="admin.html">Tanári összesítő megnyitása &rarr;</a></p>
</div>

<script>
function decodeJwtEmail(token) {
  var payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
  return payload.email;
}

function handleCredentialResponse(response) {
  var email = decodeJwtEmail(response.credential);
  sessionStorage.setItem('userEmail', email);
  showApp(email);
}

function showApp(email) {
  document.getElementById('login-box').style.display = 'none';
  document.getElementById('app-box').style.display = 'block';
  document.getElementById('user-email').textContent = email;
  checkAuthorization(email);
}

function applyAuthResult(res) {
  var authorized = !!res.authorized;
  document.getElementById('auth-warning').style.display = authorized ? 'none' : 'block';
  document.getElementById('admin-link').style.display = (res.role === 'teacher') ? 'block' : 'none';
  document.getElementById('test-select').disabled = !authorized;
  document.getElementById('start-btn').disabled = !authorized;
}

function checkAuthorization(email) {
  var cacheKey = 'authCache:' + email;
  var cached = sessionStorage.getItem(cacheKey);
  if (cached) {
    // korábbi (ugyanebben a böngésző-munkamenetben lekérdezett) eredmény azonnali
    // megjelenítése, amíg a friss adat megérkezik a háttérben - így nem kell minden
    // egyes oldalbetöltésnél kivárni az Apps Script válaszidejét
    try { applyAuthResult(JSON.parse(cached)); } catch (e) { /* hibás cache, figyelmen kívül hagyva */ }
  }

  fetch(APPS_SCRIPT_URL + '?action=whoami&email=' + encodeURIComponent(email))
    .then(function (r) { return r.json(); })
    .then(function (res) {
      sessionStorage.setItem(cacheKey, JSON.stringify(res));
      applyAuthResult(res);
    })
    .catch(function () {
      if (cached) return; // volt korábbi, cache-elt eredmény, azt már megjelenítettük
      // ha nincs semmilyen korábbi eredmény és a lekérdezés is hibázik, óvatosságból
      // ne engedjük a tesztet elindítani, amíg nem sikerül megerősíteni a jogosultságot
      document.getElementById('auth-warning').textContent =
        'Nem sikerült ellenőrizni a jogosultságodat, próbáld frissíteni az oldalt.';
      document.getElementById('auth-warning').style.display = 'block';
      document.getElementById('test-select').disabled = true;
      document.getElementById('start-btn').disabled = true;
    });
}

document.getElementById('logout-link').addEventListener('click', function (e) {
  e.preventDefault();
  sessionStorage.removeItem('userEmail');
  sessionStorage.removeItem('currentTest');
  document.getElementById('app-box').style.display = 'none';
  document.getElementById('login-box').style.display = 'block';
});

// teszt legördülő feltöltése
var sel = document.getElementById('test-select');
for (var t = 1; t <= TOTAL_TESZT; t++) {
  var opt = document.createElement('option');
  opt.value = t;
  opt.textContent = t + '. Teszt';
  sel.appendChild(opt);
}

document.getElementById('start-btn').addEventListener('click', function () {
  var test = parseInt(sel.value, 10);
  sessionStorage.setItem('currentTest', test);
  window.location.href = test + 'teszt/1feladat.html';
});

window.onload = function () {
  var existingEmail = sessionStorage.getItem('userEmail');
  if (existingEmail) { showApp(existingEmail); }

  if (window.google && google.accounts) {
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleCredentialResponse
    });
    google.accounts.id.renderButton(
      document.getElementById('g_id_signin'),
      { theme: 'outline', size: 'large' }
    );
  }
};
</script>
</body>
</html>
