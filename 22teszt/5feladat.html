<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>22. teszt - 5. feladat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js"></script>
<link rel="stylesheet" href="../style.css">
<script src="../config.js"></script>
</head>
<body data-test="22" data-feladat="5">
<h1>22. Teszt</h1>
<p><strong>5. feladat</strong></p>


<div class="text-block"><p>Négy tanuló kiszámította a \(6\sqrt3\) és \(8\sqrt3\) számok mértani közepét. Az eredményeket az alábbi táblázat tartalmazza. Melyik tanuló számolt helyesen?

<table class="data-table"><tr><th>Ilona</th><th>Timi</th><th>Lenke</th><th>Sára</th></tr><tr><td> 6</td><td>\(6\sqrt2\)</td><td>\(8\sqrt2\)</td><td>12</td></tr></table></p>

<div class="answers" id="answers">
<button type="button" class="answer-btn" data-slot="a" onclick="selectAnswer(this)"></button>
<button type="button" class="answer-btn" data-slot="b" onclick="selectAnswer(this)"></button>
<button type="button" class="answer-btn" data-slot="c" onclick="selectAnswer(this)"></button>
<button type="button" class="answer-btn" data-slot="d" onclick="selectAnswer(this)"></button>
</div></div>

<script type="application/json" id="answer-data">[{"letter": "a", "text": "Ilona"}, {"letter": "b", "text": "Timi"}, {"letter": "c", "text": "Lenke"}, {"letter": "d", "text": "Sára"}]</script>

<p id="feedback"></p>
<p><a id="next-link" class="next-btn" href="6feladat.html" style="display:none;">Következő feladat &rarr;</a></p>

<script>
(function () {
  var email = sessionStorage.getItem('userEmail');
  if (!email) { window.location.href = '../index.html'; return; }

  // a válaszgombok POZÍCIÓJA (a, b, c, d, ...) mindig fix marad a rácsban;
  // csak az, hogy melyik szöveg kerül az adott pozícióba, van kavarva.
  var answers = JSON.parse(document.getElementById('answer-data').textContent);
  for (var i = answers.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = answers[i]; answers[i] = answers[j]; answers[j] = tmp;
  }

  var buttons = document.querySelectorAll('#answers button.answer-btn');
  buttons.forEach(function (btn, i) {
    var slot = btn.dataset.slot;
    var ans = answers[i];
    btn.innerHTML = slot + ') ' + ans.text;
    btn.dataset.letter = ans.letter;  // az eredeti azonosító, ez megy a szerverre
  });

  var answered = false;

  window.selectAnswer = function (btn) {
    if (answered) return;
    answered = true;
    var all = document.querySelectorAll('#answers button.answer-btn');
    all.forEach(function (b) { b.disabled = true; });
    btn.classList.add('selected');

    var body = document.body;
    var params = new URLSearchParams({
      action: 'submit',
      email: email,
      test: body.dataset.test,
      feladat: body.dataset.feladat,
      letter: btn.dataset.letter
    });

    // GET kérést használunk POST helyett: a Google Apps Script Web App-oknál a POST
    // kérések fetch()-csel gyakran "Failed to fetch" hibával futnak el (a szerver belső
    // átirányítása miatt), miközben a GET kérések megbízhatóan működnek - lásd whoami is.
    fetch(APPS_SCRIPT_URL + '?' + params.toString())
      .then(function (r) { return r.json(); })
      .then(function (res) {
        var fb = document.getElementById('feedback');
        if (res.error === 'not_authorized') {
          fb.textContent = 'Nincs jogosultságod a teszt kitöltéséhez.';
          fb.className = 'bad';
          return;
        }
        if (res.correct) {
          btn.classList.add('correct');
          fb.textContent = 'Helyes válasz!';
          fb.className = 'ok';
        } else {
          btn.classList.add('incorrect');
          fb.textContent = 'Helytelen válasz.';
          fb.className = 'bad';
        }
        document.getElementById('next-link').style.display = 'inline-block';
      })
      .catch(function (err) {
        document.getElementById('feedback').textContent = 'Hiba a beküldéskor: ' + err;
      });
  };

  if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise(); }
})();
</script>
</body>
</html>
