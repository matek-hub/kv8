<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>1. teszt - 3. feladat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js"></script>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body data-test="1" data-feladat="3" data-week="1">
<h1>1. hét &ndash; 1. teszt</h1>
<p><strong>3. feladat</strong></p>

<div class="text-block"><p>Négy tanuló, Dárius, Antónia, Dinu és Szófia kiszámította a \(\overline{1x}\) alakú prímszámok számtani közepét, eredményeiket a mellékelt táblázat tartalmazza. A négy tanuló közül a helyes választ adta:</p>

<div class="answers" id="answers">
<button type="button" class="answer-btn" data-letter="a" onclick="selectAnswer(this)">a) Dárius</button>
<button type="button" class="answer-btn" data-letter="b" onclick="selectAnswer(this)">b) Antónia</button>
<button type="button" class="answer-btn" data-letter="c" onclick="selectAnswer(this)">c) Dinu</button>
<button type="button" class="answer-btn" data-letter="d" onclick="selectAnswer(this)">d) Szófia</button>
</div></div>

<p id="feedback"></p>
<p><a id="next-link" class="next-btn" href="1teszt_4feladat.html" style="display:none;">Következő feladat &rarr;</a></p>

<script>
(function () {
  var email = sessionStorage.getItem('userEmail');
  if (!email) { window.location.href = 'index.html'; return; }

  // válaszgombok vizuális kavarása (a data-letter mezőben marad az eredeti azonosító)
  var container = document.getElementById('answers');
  var buttons = Array.prototype.slice.call(container.children);
  for (var i = buttons.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    container.insertBefore(buttons[j], buttons[i]);
    var tmp = buttons[i]; buttons[i] = buttons[j]; buttons[j] = tmp;
  }

  var answered = false;

  window.selectAnswer = function (btn) {
    if (answered) return;
    answered = true;
    var all = container.querySelectorAll('button.answer-btn');
    all.forEach(function (b) { b.disabled = true; });
    btn.classList.add('selected');

    var body = document.body;
    var payload = {
      email: email,
      week: body.dataset.week,
      test: body.dataset.test,
      feladat: body.dataset.feladat,
      letter: btn.dataset.letter
    };

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        var fb = document.getElementById('feedback');
        if (res.correct) {
          btn.classList.add('correct');
          fb.textContent = 'Helyes válasz!';
          fb.className = 'ok';
        } else {
          btn.classList.add('incorrect');
          fb.textContent = 'Helytelen válasz.';
          fb.className = 'bad';
        }
        document.getElementById('next-link').style.display = 'inline-block';
      })
      .catch(function (err) {
        document.getElementById('feedback').textContent = 'Hiba a beküldéskor: ' + err;
      });
  };
})();
</script>
</body>
</html>
